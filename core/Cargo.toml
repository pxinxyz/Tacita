[package]
name = "restricted-gui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A no_std immediate-mode GUI library that emits draw lists; no windowing, no GPU device ownership."

[dependencies]
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
unicode-segmentation = { version = "1.13", default-features = false }
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
rustybuzz = { version = "0.20.1", default-features = false }
