# D3D12 backend for `tacita` (std crate, Windows-only).
#
# Sibling of `core`/`sdk` — the backend consumes core `DrawData` and never
# touches widget logic; the dependency arrow points backend -> core only.
# The host owns the device/queue/swapchain; this crate owns no window.

[package]
name = "tacita-d3d12"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The backend consumes core DrawData; the dependency arrow points
# backend -> core only, never the reverse.
tacita = { path = "../../core" }
# Same pin as the d3d11 backend (2026-07-23). Exact resolved version: see
# Cargo.lock.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D11", # Shader reflection ABI checks; no D3D11 device is used.
    # D3DCompile for runtime shader compilation (d3dcompiler_47.dll).
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi_Common",
    # Fence-event waits: CreateEventW / WaitForSingleObject (the former is
    # gated on Win32_Security for its SECURITY_ATTRIBUTES parameter).
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The COM-leak test probes reference counts through the raw IUnknown vtable
# and names ID3D12Resource; examples/overlay_d3d12.rs additionally needs the
# window + message loop, keyboard/mouse input, DXGI swapchain surface, and
# WNDCLASSW's GDI handle types. The library itself needs none of this.
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The example dogfoods the Win32 input adapter (message → InputState
# translation); the library itself stays renderer-only.
tacita-win32 = { path = "../../adapters/win32" }
