[package]
name = "restricted-gui-rhai-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rhai = { version = "=1.26.1", default-features = false, features = ["no_std", "f32_float", "no_module"] }
restricted-gui-sdk = { path = "../sdk" }

[profile.dev.package."*"]
opt-level = 2
